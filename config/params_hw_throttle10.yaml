# config/params_hw_throttle10.yaml
# PHASE 3, HONEST-SLOW VERSUS LYING, arm 'hw_throttle10': honest srv4 throttled to 10% (severe) from 120 s for 60 s.
#
# params_trust_full.yaml with: every attack removed (one sybil at most);
# fixed-work tasks (work_mode ops); emulated mixed hardware via cgroup v2
# (server_profiles); verified-claim routing stated explicitly; its own
# recording path. The arms differ only in latency_baseline, honest_throttle,
# malicious_edge_nodes and the record path -- pinned by tests/test_hw_arms.py.
# Needs root (cgroups), like every Mininet run.
# Prediction, registered first: docs/predictions/hw_2026-10-20.txt
#   sudo ARMS="hw_fleet hw_class hw_throttle25 hw_throttle10 hw_sybil_slow hw_sybil_fast" tools/run_replicates.sh
#   python3 -m evaluation.replicates data/runs --arms hw_fleet,hw_class,hw_throttle25,hw_throttle10,hw_sybil_slow,hw_sybil_fast
trust:
  alpha: 0.35
  beta: 0.25
  gamma: 0.25
  delta: 0.15
  lambda_decay: 0.85
  initial_score: 0.5

  isolation_threshold: 0.3
  anomaly_gate: 0.5

  rate_limit_trust: 0.5
  anomaly_warn: 0.25

edge_score:
  w1_trust: 0.50
  w2_cpu: 0.30
  w3_latency: 0.20
  selection: p2c
  d_choices: 2
  epsilon: 0.05
  # The default since 2026-10-20, stated explicitly so these recordings
  # replay the same if the default ever changes again.
  cpu_claim: verified

optimizer:
  enabled: true
  algorithm: ucb1
  window_s: 10.0
  exploration_c: 1.41
  reward:
    latency_penalty: 0.2
    imbalance_penalty: 0.2
  arms:
    - [0.50, 0.30, 0.20]
    - [0.70, 0.20, 0.10]
    - [0.34, 0.50, 0.16]
    - [0.34, 0.16, 0.50]
    - [0.45, 0.45, 0.10]

simulation:
  num_edge_nodes: 8
  num_iot_devices: 40
  # Vestigial -- kept because both entry points still read the key, but it
  # drives no behaviour: topology.py uses it only to mark the last N IoT hosts
  # into a `malicious_ids` list that nothing reads, plus a log line, and
  # run_demo.py assigns it to a local it never uses. Note it counts IoT
  # DEVICES, not edge servers, despite sitting next to the edge-node settings.
  # What actually arms an attacker is malicious_edge_nodes /
  # malicious_flood_devices / malicious_spoof_devices below and
  # security.malicious_iot_devices. 4 happens to be right either way here:
  # 4 malicious edge nodes, and 4 malicious IoT devices (iot37-iot40).
  num_malicious: 4
  duration_s: 300

  # PHASE 3 (simulation/cpu_profiles.py): emulated mixed hardware. srv1-4 are
  # the fast class, uncapped; srv5-8 the slow class, capped at half a core
  # (cgroup v2 cpu.max, 10 ms period). Profiles and throttles are NOT attacks:
  # every server here is honest unless malicious_edge_nodes says otherwise.
  server_profiles:
    srv1: {class: fast}
    srv2: {class: fast}
    srv3: {class: fast}
    srv4: {class: fast}
    srv5: {class: slow, cpu_max: "5000 10000"}
    srv6: {class: slow, cpu_max: "5000 10000"}
    srv7: {class: slow, cpu_max: "5000 10000"}
    srv8: {class: slow, cpu_max: "5000 10000"}
  # An HONEST fast-class server throttled mid-run, as a hot cabinet would.
  honest_throttle:
    - {node: srv4, start_s: 120, duration_s: 60, cpu_max: "1000 10000"}
  malicious_edge_nodes: []
  malicious_flood_devices: []
  malicious_spoof_devices: []

security:
  auth_scheme: present80
  shared_key_hex: "00112233445566778899"

  # Malicious IoT devices (wrong key -> denied at admission, never generate
  # VIP traffic). Separate from malicious_edge_nodes above.
  # No wrong-key devices: every client is honest in Phase 3.
  malicious_iot_devices: []

blockchain:
  max_updates_per_block: 10
  block_commit_timeout_s: 5.0

controller:
  vip: 10.0.99.1
  vip_port: 9000

  api_host: 0.0.0.0
  api_port: 8081

  flow_idle_timeout_s: 10
  flow_hard_timeout_s: 30
  monitor_interval_s: 1.0

  latency_liar_ratio: 3.0
  latency_liar_floor_ms: 40.0
  idle_claim_threshold: 0.25
  latency_liar_persist: 3

  rate_limit:
    enabled: true
    rate_kbps: 2000
    burst_kb: 200

  dashboard:
    enabled: true
    record_path: data/events_hw_throttle10.jsonl

  honesty_deviation_threshold: 0.40
  # PHASE 3: what the latency tell compares a server's /status round trip
  # with -- the fleet median, or the median of its own hardware class.
  latency_baseline: class

  # How often a node quarantined on TRUST alone -- with its anomaly rail
  # already back below the gate -- is offered a single trial task, so it can
  # earn trust back. Without this, quarantine is an absorbing state: it cuts
  # the service traffic that produces the only outcomes R and B are built
  # from, so a node below the isolation threshold can never climb back over
  # it. The 8/40/3 live run ended with srv1/srv4/srv7 at anomaly 0.0, 29ms
  # RTT and zero inflight -- provably healthy -- and isolated for the rest of
  # the run at trust ~0.18. See contracts/thresholds.py and
  # docs/LIVE_RUN_8_40_3.md.
  #
  # The anomaly gate is NOT relaxed by this: a node the anomaly rail has
  # flagged is never probed. The exposure is one task per node per interval.
  probation_interval_s: 5.0

agents:
  node_port: 8000
  # Workload intensity, tuned so a 4-core box can actually carry 8/40/3.
  #
  # The scale figures the deck commits to are topological -- 8 edge servers,
  # 40 IoT devices, 3 attackers -- and those are unchanged above. What is
  # tuned here is how hard each device pushes, which is a property of the
  # host, not of the architecture.
  #
  # The arithmetic that matters: offered task CPU = num_iot / report_interval_s
  # x task_work_ms. At the demo-scale values (1.0s / 40ms) that is
  # 40/1.0 x 40ms = 1.60 cores of pure task work, 40% of a 4-core box BEFORE
  # the 40 client + 8 agent + controller + OVS processes are scheduled at all.
  # The first live run measured the result: 243.7ms mean task latency against
  # 40ms of actual work, and a 90% client timeout rate.
  # At 2.0s / 15ms it is 40/2.0 x 15ms = 0.30 cores (8%), which leaves the
  # control plane -- the thing under test -- room to be measured rather than
  # starved.
  #
  # To run this as a deliberate saturation experiment instead, put these back
  # to 1.0 / 40 and expect the collapse documented in docs/LIVE_RUN_8_40_3.md.
  report_interval_s: 2.0
  # 2x the old value: under load the honest tail matters more than a tight
  # bound, and every abandoned task costs the controller a phantom inflight
  # until the reaper (1.5x this) drops it.
  task_timeout_s: 4.0
  task_work_ms: 15
  # PHASE 3: a fixed amount of WORK per task (45,000 SHA-256 iterations,
  # ~15 ms on this host at full speed -- the same CPU per task as the shipped
  # 15 ms burn) instead of 15 ms of wall clock, so a capped server really
  # takes longer per task, as slower hardware would.
  work_mode: ops
  work_ops: 45000
