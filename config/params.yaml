# config/params.yaml
# Trust formula weights (must sum to 1.0)
trust:
  alpha: 0.35           # Reputation weight
  beta: 0.25            # Behavioural consistency weight
  gamma: 0.25           # Resource honesty weight
  delta: 0.15           # Attack suspicion weight
  lambda_decay: 0.85    # EMA decay factor (higher = slower forgetting)
  initial_score: 0.5    # Starting trust for new devices

  # A node is excluded from routing when EITHER condition holds:
  isolation_threshold: 0.3   # trust score T falls below this, OR
  anomaly_gate: 0.5          # smoothed anomaly Ā reaches this (quarantine gate).
  # See contracts/thresholds.py for why the anomaly gate is required: the trust
  # formula alone cannot isolate a node that lies about its load but still
  # serves tasks well (it floors at T=0.44, never crossing 0.3).

# EdgeScore weights (must sum to 1.0)
edge_score:
  w1_trust: 0.50
  w2_cpu: 0.30
  w3_latency: 0.20

# Simulation
simulation:
  num_edge_nodes: 8
  num_iot_devices: 40
  num_malicious: 3
  duration_s: 120        # Shorter for review demo (was 300)

# Blockchain
blockchain:
  max_updates_per_block: 10
  block_commit_timeout_s: 5.0
