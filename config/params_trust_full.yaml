# config/params_trust_full.yaml
# Full-scale live trust-aware demo: 8 edge servers / 40 IoT devices / 3
# malicious edge servers (+ 2 malicious IoT devices for the auth-deny path).
#
# This is params_trust_demo.yaml (4/12/1) scaled to the deck's numbers, used
# by `run_demo.py --mode mininet` (Project Plan Step 3) to validate all four
# NFRs against a real Mininet network + real os-ken controller: routing
# decision <200ms, isolation <3s, blockchain overhead <15%, RAFT commit
# <500ms (RAFT measured separately -- see docs/RAFT.md, plan.md Step 2).
#
# "3 malicious" here means malicious EDGE SERVERS, matching the evaluation
# harness's convention (config/params.yaml's num_malicious=3 is consumed the
# same way by evaluation/baseline.py -- the last N node indices become
# attackers). The 2 malicious IoT devices below are a separate mechanism
# (PRESENT-80 admission denial, Sprint 2) layered on top, not counted against
# num_malicious. See plan.md Step 6 / DIRECTION.md for why this
# malicious-edge-servers vs. malicious-IoT-devices split is called out as an
# open reframing rather than silently assumed.
trust:
  alpha: 0.35
  beta: 0.25
  gamma: 0.25
  delta: 0.15
  lambda_decay: 0.85
  initial_score: 0.5

  isolation_threshold: 0.3
  anomaly_gate: 0.5

  rate_limit_trust: 0.5
  anomaly_warn: 0.25

edge_score:
  w1_trust: 0.50
  w2_cpu: 0.30
  w3_latency: 0.20
  selection: p2c
  d_choices: 2
  epsilon: 0.05

optimizer:
  enabled: true
  algorithm: ucb1
  window_s: 10.0
  exploration_c: 1.41
  reward:
    latency_penalty: 0.2
    imbalance_penalty: 0.2
  arms:
    - [0.50, 0.30, 0.20]
    - [0.70, 0.20, 0.10]
    - [0.34, 0.50, 0.16]
    - [0.34, 0.16, 0.50]
    - [0.45, 0.45, 0.10]

simulation:
  num_edge_nodes: 8
  num_iot_devices: 40
  # Vestigial -- kept because both entry points still read the key, but it
  # drives no behaviour: topology.py uses it only to mark the last N IoT hosts
  # into a `malicious_ids` list that nothing reads, plus a log line, and
  # run_demo.py assigns it to a local it never uses. Note it counts IoT
  # DEVICES, not edge servers, despite sitting next to the edge-node settings.
  # What actually arms an attacker is malicious_edge_nodes /
  # malicious_flood_devices / malicious_spoof_devices below and
  # security.malicious_iot_devices. 4 happens to be right either way here:
  # 4 malicious edge nodes, and 4 malicious IoT devices (iot37-iot40).
  num_malicious: 4
  duration_s: 300

  # 4 malicious edge servers, one per node-side attack class, deliberately
  # spread across the fleet (not adjacent node indices) so p2c/epsilon routing
  # has to route around attackers scattered through its sampling pool rather
  # than clustered at one end. Onsets are staggered so each attack has a clean
  # baseline interval before it and the interval report shows its effect
  # arriving (plan_adv.md Phase 0/2).
  #
  # 4 of 8 is exactly half the fleet, which would normally threaten the latency
  # tell's fleet-MEDIAN baseline (it assumes an honest majority). It is safe
  # here, and the reason is worth stating rather than assuming: only the two
  # CPU-burning attacks make a node slow to answer /status. Blackhole and
  # grayhole answer /status at full speed and misbehave only on /task, so at
  # most 2 of 8 nodes are ever slow and the median stays firmly among the
  # honest six. Adding a third CPU-burner would break that and must not be
  # done without re-checking controller/flow_monitor.py's baseline assumption.
  malicious_edge_nodes:
    - node: srv3
      attack: sybil
      start_s: 20
    - node: srv6
      attack: drop            # reported as 'blackhole' -- see attack_classifier
      start_s: 30
    - node: srv1
      attack: grayhole
      start_s: 40
      grayhole_drop_rate: 0.5
    - node: srv8
      attack: onoff
      start_s: 50
      # 20s period / 0.5 duty = a 10s good phase. Must clear
      # ONOFF_MIN_GOOD_PHASE_S (~4s) or the attack is still caught but is
      # classified as sybil -- see controller/attack_classifier.py.
      onoff_period_s: 20.0
      onoff_duty: 0.5

  # DDoS/flooding device (plan_adv.md Phase 1). Rate chosen against the
  # detector, not for maximum damage: expected per-device rate is
  # 1/report_interval_s = 0.5 Hz, and the tell needs >5x that and >=3 Hz. Three
  # workers at 0.25s pacing is ~12 Hz, i.e. 24x expected -- unambiguous to the
  # detector while adding only ~12 req/s on top of the fleet's ~20. Deliberately
  # NOT the unpaced default: this box is 4 cores, and every previous collapse in
  # this project's live runs traces to offered load, not to the architecture
  # (see docs/LIVE_RUN_8_40_3.md).
  malicious_flood_devices:
    - device: iot37
      start_s: 60
      concurrency: 3
      interval_s: 0.25

  # Identity-spoofing device: holds the fleet-wide key (so it must NOT appear
  # in security.malicious_iot_devices below, which hands out a wrong key) and
  # uses it to authenticate as iot1. start_s is late enough that iot1 has
  # certainly authenticated first, which is what arms the source-IP pin.
  malicious_spoof_devices:
    - device: iot38
      target: iot1
      start_s: 15

security:
  auth_scheme: present80
  shared_key_hex: "00112233445566778899"

  # Malicious IoT devices (wrong key -> denied at admission, never generate
  # VIP traffic). Separate from malicious_edge_nodes above.
  malicious_iot_devices:
    - iot39
    - iot40

blockchain:
  max_updates_per_block: 10
  block_commit_timeout_s: 5.0

controller:
  vip: 10.0.99.1
  vip_port: 9000

  api_host: 0.0.0.0
  api_port: 8081

  flow_idle_timeout_s: 10
  flow_hard_timeout_s: 30
  monitor_interval_s: 1.0

  latency_liar_ratio: 3.0
  latency_liar_floor_ms: 40.0
  idle_claim_threshold: 0.25
  latency_liar_persist: 3

  rate_limit:
    enabled: true
    rate_kbps: 2000
    burst_kb: 200

  dashboard:
    enabled: true
    record_path: data/events.jsonl

  honesty_deviation_threshold: 0.40

  # How often a node quarantined on TRUST alone -- with its anomaly rail
  # already back below the gate -- is offered a single trial task, so it can
  # earn trust back. Without this, quarantine is an absorbing state: it cuts
  # the service traffic that produces the only outcomes R and B are built
  # from, so a node below the isolation threshold can never climb back over
  # it. The 8/40/3 live run ended with srv1/srv4/srv7 at anomaly 0.0, 29ms
  # RTT and zero inflight -- provably healthy -- and isolated for the rest of
  # the run at trust ~0.18. See contracts/thresholds.py and
  # docs/LIVE_RUN_8_40_3.md.
  #
  # The anomaly gate is NOT relaxed by this: a node the anomaly rail has
  # flagged is never probed. The exposure is one task per node per interval.
  probation_interval_s: 5.0

agents:
  node_port: 8000
  # Workload intensity, tuned so a 4-core box can actually carry 8/40/3.
  #
  # The scale figures the deck commits to are topological -- 8 edge servers,
  # 40 IoT devices, 3 attackers -- and those are unchanged above. What is
  # tuned here is how hard each device pushes, which is a property of the
  # host, not of the architecture.
  #
  # The arithmetic that matters: offered task CPU = num_iot / report_interval_s
  # x task_work_ms. At the demo-scale values (1.0s / 40ms) that is
  # 40/1.0 x 40ms = 1.60 cores of pure task work, 40% of a 4-core box BEFORE
  # the 40 client + 8 agent + controller + OVS processes are scheduled at all.
  # The first live run measured the result: 243.7ms mean task latency against
  # 40ms of actual work, and a 90% client timeout rate.
  # At 2.0s / 15ms it is 40/2.0 x 15ms = 0.30 cores (8%), which leaves the
  # control plane -- the thing under test -- room to be measured rather than
  # starved.
  #
  # To run this as a deliberate saturation experiment instead, put these back
  # to 1.0 / 40 and expect the collapse documented in docs/LIVE_RUN_8_40_3.md.
  report_interval_s: 2.0
  # 2x the old value: under load the honest tail matters more than a tight
  # bound, and every abandoned task costs the controller a phantom inflight
  # until the reaper (1.5x this) drops it.
  task_timeout_s: 4.0
  task_work_ms: 15
